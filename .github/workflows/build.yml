name: Build APK from zip
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q project.zip -d src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: |
          ROOT=$(dirname "$(find src \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)")
          echo "Project folder: $ROOT"
          ls "$ROOT"
          cd "$ROOT"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "src/**/build/outputs/apk/debug/*.apk"
